name: Auto Retrain on New Data

permissions:
  contents: write

on:
  push:
    paths:
      - '.github/workflows/retrain-on-push.yml'
      - 'data/**'

  schedule:
    - cron: '0 */12 * * *'

  workflow_dispatch:

jobs:
  monitor-and-retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dvc pandas numpy tensorflow scikit-learn joblib scipy matplotlib dvclive

      - name: Configure DVC remote
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user ${{ secrets.DAGSHUB_USER }}
          dvc remote modify origin --local password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Debug DVC configuration
        run: |
          echo "================================="
          echo "CURRENT COMMIT"
          echo "================================="
          git rev-parse HEAD

          echo ""
          echo "================================="
          echo "DVC REMOTE"
          echo "================================="
          dvc remote list

          echo ""
          echo "================================="
          echo "DATA DIRECTORY"
          echo "================================="
          ls -lah data || true

          echo ""
          echo "================================="
          echo "DVC FILE CONTENTS"
          echo "================================="
          cat data/power_consumption.csv.dvc || true

          echo ""
          echo "================================="
          echo "DVC STATUS CLOUD"
          echo "================================="
          dvc status -c || true

      - name: Pull latest DVC data
        run: |
          echo "Pulling dataset from DVC remote..."
          dvc pull -v data/power_consumption.csv.dvc

          echo ""
          echo "Checking data folder..."
          ls -lah data

          echo ""
          echo "Verifying dataset exists..."
          test -f data/power_consumption.csv

      - name: Run monitoring
        run: |
          echo "Running monitoring..."
          python src/monitor.py || echo "Monitoring completed with warnings"

      - name: Run DVC pipeline
        run: |
          echo "Running DVC pipeline stages only..."
          dvc repro preprocess train evaluate monitor

      - name: Push updated artifacts to DVC
        run: |
          dvc push

      - name: Commit updated pipeline files
        run: |
          git add dvc.lock || true
          git add artifacts/ reports/ || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(ci): automated retraining pipeline"
            git push
          fi

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports-${{ github.run_id }}
          path: |
            reports/
            artifacts/metrics/
          retention-days: 7

      - name: Completion message
        run: |
          echo "=========================================="
          echo "PIPELINE COMPLETED SUCCESSFULLY"
          echo "=========================================="
          echo "Monitoring completed"
          echo "Model retrained via DVC"
          echo "Artifacts pushed to DVC remote"
          echo "Changes committed back to GitHub"